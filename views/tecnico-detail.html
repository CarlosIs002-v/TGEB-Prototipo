          <div class="hero-card">

                  <div class="stat-number">${stat.num}</div>
                  <div class="stat-label">${stat.label}</div>

              `,
                )
                .join("")}

              <div class="card">
                <h2 class="section-title">Descripción Técnica</h2>

                        ${item}

                      .join("")}

              <div class="card certs-card">
