<div class="slide" id="slide-7">
  <header class="app-header" style="background: white; position: relative; z-index: 10;">
    <a class="nav-logo" style="cursor:pointer;" onclick="goToSlide(0)">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M12 2L3 7v10l9 5 9-5V7L12 2z" fill="currentColor"/>
        </svg>
      </div>
      <div class="nav-logo-text"><strong>TGEB</strong><span>Total Green Energy Buildings</span></div>
    </a>
    <ul class="nav-links">
      <li><a class="nav-inicio active" style="cursor:pointer;" onclick="goToSlide(0)">Inicio</a></li>
      <li><a class="nav-simulador" style="cursor:pointer;" onclick="goToSlide(8)">Simulador</a></li>
      <li><a class="nav-proyectos" style="cursor:pointer;" onclick="goToSlide(5)">Proyectos</a></li>
      <li><a class="nav-biblioteca" style="cursor:pointer;" onclick="goToSlide(7)">Biblioteca</a></li>
      <li><a class="nav-ayuda" style="cursor:pointer;" onclick="goToSlide(6)">Ayuda</a></li>
    </ul>
    <div class="user-controls">
      <div class="bell">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      </div>
      <div class="avatar" onclick="openUserSettings()">U</div>
    </div>
  </header>

  <div class="app-content" style="background: var(--page-bg);">
    <div class="section-header-custom">
      <h2 class="section-title" style="font-size: 36px; color: var(--text-main);">Directorio de Socios</h2>
      <p class="section-subtitle" style="color: var(--text-secondary); max-width: 600px; margin: 0 auto;">Explora las tecnologías y soluciones de las marcas líderes que impulsan la sustentabilidad global.</p>
    </div>

    <div class="sponsors-grid" id="grid-sponsors"></div>
  </div>

  <!-- Modal nativo: panel lateral -->
  <dialog id="sponsorModal" class="side-panel">
    <header class="panel__header">
      <span class="panel__eyebrow">Detalle del Socio</span>
      <button class="panel__close" id="modalClose" aria-label="Cerrar panel">✕</button>
    </header>
    <div class="panel__body" id="panelContent">
      <!-- contenido inyectado por JS -->
    </div>
  </dialog>

  <style>
    #slide-7 .app-content {
      padding: 60px 6%;
      width: 100%;
    }

    .section-header-custom {
      margin-bottom: 56px;
      text-align: center;
      width: 100%;
      max-width: 1400px;
    }

    /* ─── Grid ─── */
    .sponsors-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 32px;
      width: 100%;
      max-width: 1400px;
    }

    /* ─── Card Premium ─── */
    .sponsor-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      display: flex;
      flex-direction: column;
      gap: 24px;
      position: relative;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .sponsor-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 30px 60px rgba(6, 78, 59, 0.08);
      border-color: var(--primary-hover);
    }

    .sponsor-card__logo-wrap {
      width: 72px;
      height: 72px;
      border-radius: 16px;
      background: var(--page-bg);
      border: 1.5px solid var(--border);
      display: grid;
      place-items: center;
      overflow: hidden;
      transition: all 0.3s;
    }

    .sponsor-card:hover .sponsor-card__logo-wrap {
      border-color: var(--primary-hover);
      background: white;
    }

    .sponsor-card__logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 12px;
    }

    .sponsor-card__name {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 24px;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .sponsor-card__origin {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary);
      opacity: 0.8;
    }

    .sponsor-card__specialty {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .sponsor-card__cta {
      margin-top: auto;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--primary);
      font-weight: 700;
      font-size: 14px;
    }

    .cta-arrow-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--page-bg);
      display: grid;
      place-items: center;
      transition: all 0.3s;
    }

    .sponsor-card:hover .cta-arrow-circle {
      background: var(--primary);
      color: white;
      transform: translateX(4px);
    }

    /* ─── Modal Content Styling ─── */
    .modal-hero {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }

    .modal-logo {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 12px;
      background: white;
    }

    .modal-header-text h2 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .modal-section {
      margin-bottom: 32px;
    }

    .modal-section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 12px;
      display: block;
    }

    .modal-text {
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    .modal-tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .modal-tag {
      background: rgba(6, 78, 59, 0.05);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 99px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid rgba(6, 78, 59, 0.1);
    }
  </style>

  <script>
    (function() {
      const sponsorsData = [
        {
          id: 'longi',
          nombre: 'LONGi Solar',
          logo: 'https://placehold.co/200x200/f7f5f0/1e2d26?text=LONGi',
          origen: 'China',
          especialidad: 'Módulos fotovoltaicos monocristalinos de alta eficiencia.',
          descripcion: 'LONGi es el líder mundial en tecnología solar, especializado en la fabricación de obleas y celdas monocristalinas que establecen estándares de eficiencia en la industria.',
          tags: ['Energía Solar', 'I+D Avanzado', 'Escala Global']
        },
        {
          id: 'canadian',
          nombre: 'Canadian Solar',
          logo: 'https://placehold.co/200x200/f7f5f0/1e2d26?text=CdnSolar',
          origen: 'Canadá',
          especialidad: 'Soluciones solares integradas y almacenamiento BESS.',
          descripcion: 'Reconocida por su calidad superior, Canadian Solar ofrece desde paneles de alto rendimiento hasta sistemas complejos de almacenamiento de energía.',
          tags: ['Almacenamiento', 'Infraestructura', 'Sostenibilidad']
        },
        {
          id: 'huawei',
          nombre: 'Huawei Solar',
          logo: 'https://placehold.co/200x200/f7f5f0/1e2d26?text=Huawei',
          origen: 'China',
          especialidad: 'Inversores inteligentes y digitalización energética.',
          descripcion: 'Líder en la digitalización de la energía solar, Huawei integra IA para optimizar la generación y el consumo en plantas industriales y residenciales.',
          tags: ['IA', 'Digitalización', 'Eficiencia']
        },
        {
          id: 'fronius',
          nombre: 'Fronius',
          logo: 'https://placehold.co/200x200/f7f5f0/1e2d26?text=Fronius',
          origen: 'Austria',
          especialidad: 'Electrónica de potencia e inversores de alta gama.',
          descripcion: 'Con ingeniería europea de precisión, Fronius es sinónimo de durabilidad y conectividad inteligente para sistemas fotovoltaicos modernos.',
          tags: ['Calidad Europea', 'Conectividad', 'Residencial']
        }
      ];

      const grid = document.getElementById('grid-sponsors');
      const modal = document.getElementById('sponsorModal');
      const content = document.getElementById('panelContent');
      const closeBtn = document.getElementById('modalClose');

      function render() {
        grid.innerHTML = sponsorsData.map(s => `
          <div class="sponsor-card" onclick="openSponsor('${s.id}')">
            <div class="sponsor-card__logo-wrap">
              <img src="${s.logo}" alt="${s.nombre}">
            </div>
            <div>
              <p class="sponsor-card__origin">${s.origen}</p>
              <h3 class="sponsor-card__name">${s.nombre}</h3>
              <p class="sponsor-card__specialty">${s.especialidad}</p>
            </div>
            <div class="sponsor-card__cta">
              <span>Explorar perfil</span>
              <div class="cta-arrow-circle">→</div>
            </div>
          </div>
        `).join('');
      }

      window.openSponsor = function(id) {
        const s = sponsorsData.find(x => x.id === id);
        if(!s) return;

        content.innerHTML = `
          <div class="modal-hero">
            <img src="${s.logo}" class="modal-logo" alt="${s.nombre}">
            <div class="modal-header-text">
              <h2>${s.nombre}</h2>
              <p class="sponsor-card__origin">Sede: ${s.origen}</p>
            </div>
          </div>

          <div class="modal-section">
            <span class="modal-section-title">Especialidad</span>
            <p class="modal-text">${s.especialidad}</p>
          </div>

          <div class="modal-section">
            <span class="modal-section-title">Trayectoria y Visión</span>
            <p class="modal-text">${s.descripcion}</p>
          </div>

          <div class="modal-section">
            <span class="modal-section-title">Áreas de Enfoque</span>
            <div class="modal-tag-container">
              ${s.tags.map(t => `<span class="modal-tag">${t}</span>`).join('')}
            </div>
          </div>

          <button class="btn-primary" style="width: 100%; margin-top: 24px;" onclick="document.getElementById('sponsorModal').close()">
            Cerrar Detalles
          </button>
        `;
        modal.showModal();
      };

      closeBtn.onclick = () => modal.close();
      modal.onclick = (e) => { if (e.target === modal) modal.close(); };

      render();
    })();
  </script>
  <style>
    dialog.side-panel, dialog.side-panel:modal {
      position: fixed !important;
      top: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      left: auto !important;
      height: 100vh !important;
      max-height: 100vh !important;
      margin: 0 !important;
      border-radius: 0 !important;
    }
  </style>
</div>
